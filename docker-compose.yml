# Ferrero on a Linux server (README, "Deploying to a server"):
#
#     docker compose up -d --build        # then open http://<server>/
#
# Credentials (Bedrock/AWS keys, the Superset account) come from .env next to this file, at run time only.
# Superset embeds its dashboards only in pages whose address is in its frame-ancestors list. http://3.75.206.231
# (port 80) is on that list, so keep the published port at 80 there. FERRERO_HTTP_PORT (shell or .env) changes it.
#
# Everyone signs in: set FERRERO_PASSWORD in .env (the administrator, admin@ferrero.com, who then adds users and
# gives them passwords), or nobody can. On plain HTTP the
# passwords and the session cookie cross the network unencrypted: put HTTPS in front before real users sign in, and
# keep the port limited to known addresses (EC2 security group) until then.
services:
  ferrero:
    build: .
    image: ferrero:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "${FERRERO_HTTP_PORT:-80}:8000"
    volumes:
      # Users' records: case changes, evidence files, follow-ups, notifications, the audit trail. Back this volume up.
      - ferrero-records:/app/data/records
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ferrero-records:
