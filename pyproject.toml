[project]
name = "ferrero-case-intelligence"
version = "0.1.0"
description = "Ferrero case-intelligence demo: the document sync and the bilingual Ferrero assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-docx>=1.1",
    "pypdf>=5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
bedrock = ["anthropic[bedrock]>=2.8,<3"]  # botocore, for Claude on Amazon Bedrock
# Text recognition for scans with Baidu's Unlimited-OCR-2 in this process (CPU or NVIDIA GPU). Versions are the ones
# Baidu tested its model code with. Keep it in its own environment (.venv-ocr): the web app does not need it.
ocr = [
    "torch==2.13.0", "torchvision", "pillow", "numpy",
    "transformers==4.52.1", "tokenizers==0.21.4", "huggingface-hub==0.36.0",
    "addict==2.4.0", "einops==0.8.2", "easydict==1.13", "requests", "tqdm",
]

[project.scripts]
ferrero-sync = "ferrero.sync.cli:main"
ferrero-ocr = "ferrero.ocr.cli:main"
ferrero-eval = "ferrero.eval.cli:main"
ferrero-web = "ferrero.web.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ferrero = ["web/static/*", "web/marks/*", "eval/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
